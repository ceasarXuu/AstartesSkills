version: 1
display_name: Plan Report
short_description: Report plan implementation results with evidence-based completion percentages, concrete engineering benefits, gaps, and next actions.
default_prompt: Use $plan-report to produce an implementation result report for a plan, roadmap, PRD, engineering plan, refactor plan, migration plan, release plan, or task list. Inspect the actual artifacts first, calculate overall, stage, and module completion percentages from explicit denominators, map planned goals and subgoals to work actually done, give concrete engineering benefits with metrics, baselines, targets, observed results, and verification evidence, list every unfinished item with reason and impact, recommend next actions, and format the report primarily as tables and Mermaid charts without vague completion phrases.
