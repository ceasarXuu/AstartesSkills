version: 1
display_name: SE Good Plan
short_description: Write concise engineering plans with a user-confirmed decision baseline.
default_prompt: Use $se-good-plan to write or review a software engineering plan. For a formal repository plan, create or reuse exactly two independent, cross-linked topic artifacts at docs/releases/<confirmed-version>/<topic-slug>/decisions.md and plan.md; do not invent the release version or create parallel plan copies. decisions.md is the user-confirmed product decision baseline with Must Do, Must Not Do, rationale, violation signal, confirmation, and proposed/active/superseded state. Only user-confirmed decisions may be active. plan.md is the main document and must contain Design, Work Units, applicable active decision IDs, conditional bounded validation, useful phases, and execution-time reconciliation. Verified evidence may revise the technical plan but cannot silently rewrite active product decisions; decision conflict pauses downstream work pending user confirmation. Prefer deleting, changing, or reusing existing logic before new construction. Keep work units concrete, minimum-necessary, beneficial, side-effect-aware, independently verifiable, and safely stoppable. Do not turn validation into shadow implementation, mechanically follow stale plans, mix state models, or add fixed supporting artifacts beyond the required two.
