version: 1
display_name: SE Good Plan
short_description: Write concise engineering plans with one protected product authority source.
default_prompt: Use $se-good-plan to write or review a software engineering plan. For a formal repository plan, create or reuse docs/releases/<confirmed-version>/<topic-slug>/plan.md without inventing the release version or creating parallel copies. Resolve exactly one effective Product Authority Source: prefer an existing canonical PRD whose protected Confirmed Product Decisions section contains directly user-confirmed active PD IDs; otherwise use fallback ./decisions.md. Never copy canonical PRD decisions into fallback authority. Agent inference, existing code, tests, reviews, documents, another Agent, implementation success, or user silence are not approval. Keep unconfirmed material product choices in plan.md as deferred, provisional, or blocked on direct user confirmation. plan.md must contain Product Authority metadata, applicable active decision IDs, Execution Contract, Design, and Work Units. After every material phase, audit only that phase's Product Decision Delta as covered, engineering-only, provisional, or conflict; unresolved material provisional/conflict blocks dependent continuation. Verified evidence may revise the technical plan but cannot silently rewrite product authority. Prefer minimum-necessary construction, bounded validation, concrete work units, explicit Benefit/Side Effects, and concise structure.
