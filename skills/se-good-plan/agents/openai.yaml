version: 1
display_name: SE Good Plan
short_description: Write phased, executable, verifiable, reviewable software engineering plans.
default_prompt: Use $se-good-plan to write or review a software engineering plan, including implementation, refactor, migration, rollout, bug-fix, performance optimization, security change, and DevOps / CI/CD plans. Classify the task type and risk, choose Lightweight, Standard, or Full depth, do not invent schedules or staffing, make assumptions and open questions explicit, split the work into phases with gates, and include testing, release, rollback or fallback, observability, and evidence-based acceptance criteria.
