version: 1
display_name: SE Good Plan
short_description: Write concise executable engineering plans from concrete, beneficial, independently checkable work units.
default_prompt: Use $se-good-plan to write or review a software engineering plan. Make every implementation item executable by naming the concrete change location, target object, engineering action, resulting behavior, benefit, verification, and safe-stop boundary. The benefit is mandatory for every work unit and must explain the project, user, team, delivery, reliability, cost, support, risk, or operational value in language understandable to wider project members; it must not merely repeat the technical behavior. Split work into the smallest closed-loop engineering units with one primary objective, change axis, and action; follow small-step delivery and do not hide broad coupled changes inside a phase. Keep the document concise and proportional. In Plan Authoring mode use only planned, blocked-on-discovery, or deferred states and never claim complete, landed, verified, or proceed without real execution evidence. Keep discovery and design artifact states separate from production-code implementation states. Include release, rollback, observability, data, security, and formal benefit validation only where relevant to the risk or decision.
