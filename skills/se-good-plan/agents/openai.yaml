version: 1
display_name: SE Good Plan
short_description: Write concise plans from minimum-necessary, beneficial, side-effect-aware engineering units.
default_prompt: Use $se-good-plan to write or review a software engineering plan. Prefer deleting, changing, or reusing existing logic before adding local logic, new abstractions, dependencies, states, or infrastructure; speculative future use is not sufficient justification. Make every work unit executable by naming the change location, target object, one action, resulting behavior, mandatory Benefit, mandatory Side Effects, verification, and safe-stop boundary. Benefit must explain wider project value. Side Effects must state both Complexity delta (code, concepts, states, branches, dependencies, configuration, schemas, runtime paths, temporary logic) and Reach/Cost (affected modules, callers, data, build/test/CI, deployment, resources, security, operations, support, ownership, and cleanup). Split work into the smallest closed-loop units and expose cumulative cross-unit side effects at phase level when applicable. Keep Plan Authoring separate from Execution Tracking and artifact states separate from code states. Keep the document concise and proportional.
