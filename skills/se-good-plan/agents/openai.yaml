version: 1
display_name: SE Good Plan
short_description: Write concise engineering plans with protected user product authority and phase decision audits.
default_prompt: Use $se-good-plan to write or review a software engineering plan. For a formal repository plan, create or reuse exactly two independent, cross-linked topic artifacts at docs/releases/<confirmed-version>/<topic-slug>/decisions.md and plan.md; do not invent the release version or create parallel plan copies. decisions.md is a protected user-authority product baseline: only directly user-confirmed decisions belong there, each change requires explicit user approval, Agent self-approval is forbidden, and allowed states are active/superseded. Agent inference, existing code, tests, reviews, other documents, another Agent, or user silence are not approval. Keep unconfirmed material product choices in plan.md: defer them when possible, use provisional behavior only when local/reversible/necessary, and ask the user before high-impact or hard-to-reverse choices. plan.md must contain Execution Contract, Design, Work Units, and applicable active decision IDs. After every material phase, audit only that phase's Product Decision Delta and classify each item as covered, engineering-only, provisional, or conflict; unresolved material provisional/conflict blocks dependent continuation. Verified evidence may revise the technical plan but cannot silently rewrite product authority. Prefer minimum-necessary construction, bounded validation, concrete work units, explicit Benefit/Side Effects, and concise structure with no fixed artifacts beyond the required two.
