version: 1
display_name: SE Good Plan
short_description: Write concise, minimum-necessary, evidence-updated engineering plans.
default_prompt: Use $se-good-plan to write or review a software engineering plan. Prefer deleting, changing, or reusing existing logic before adding abstractions, dependencies, states, or infrastructure. Split work into smallest closed-loop units with concrete location, target, one action, behavior, mandatory Benefit, mandatory Complexity plus Reach/Cost Side Effects, exact verification, and safe-stop boundary. When a critical unknown could invalidate substantial later work, add only a bounded minimum-sufficient pre-investment validation: name the assumption, decision, cheapest credible evidence level, enough-evidence threshold, what remains unproven, budget, allowed artifacts, forbidden production changes, stop, cleanup, and validation status. Do not turn validation into shadow implementation or treat Mock/Sandbox/Prototype evidence as production integration. In Execution Tracking, reconcile evidence after each material phase; current verified facts outrank the old plan, prior conclusions remain traceable, and needs-revision or invalidated plans cannot continue unchanged. Keep plan, validation, execution, artifact, code, and plan-validity states separate. Keep the document concise and proportional.
