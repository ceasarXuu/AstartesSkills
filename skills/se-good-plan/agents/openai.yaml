version: 1
display_name: SE Good Plan
short_description: Write concise engineering plans with protected product authority and pre-phase rebase gates.
default_prompt: Use $se-good-plan to write or review a software engineering plan. For a formal repository plan, create or reuse docs/releases/<confirmed-version>/<topic-slug>/plan.md without inventing the release version or creating parallel copies. Resolve exactly one effective Product Authority Source: prefer an existing canonical PRD whose protected Confirmed Product Decisions section contains directly user-confirmed active PD IDs; otherwise use fallback ./decisions.md. Never copy canonical PRD decisions into fallback authority. Agent inference, existing code, tests, reviews, documents, another Agent, implementation success, or user silence are not approval. Keep unconfirmed material product choices in plan.md as deferred, provisional, or blocked on direct user confirmation. plan.md must contain Product Authority metadata, applicable active decision IDs, Execution Contract, Design, and Work Units. After every material phase, audit only that phase's Product Decision Delta. Before every material phase, run the persisted Pre-Phase Plan Rebase Gate inside that Phase: compare actual completed code/config/schema/docs/tests/evidence with all remaining Design, Work Units, assumptions, dependencies, verification, and sequencing. Do not start a Phase while its gate is pending or blocked-on-plan-approval. If the remaining plan changes materially, record the Plan Delta, obtain explicit direct user approval for that revision, apply the approved changes to the canonical plan.md, preserve delta history, and only then mark the gate ready and execute. Verified evidence may revise the technical plan but cannot silently rewrite product authority. Prefer minimum-necessary construction, bounded validation, concrete work units, explicit Benefit/Side Effects, and concise structure.
