version: 1
display_name: Bug Killer
short_description: Agile code-first debugging for complex or recurring bugs.
default_prompt: Use $bug-killer to investigate this bug in short iterations. Trace the relevant code first, identify a concrete mechanism, and make and validate the smallest authorized fix without requiring reproduction or conclusive proof beforehand. Scale case tracking and independent paths to the problem; respect project permissions and test restrictions, and report the repair as unverified until relevant evidence supports resolution.
