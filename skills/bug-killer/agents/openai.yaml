version: 1
display_name: Bug Killer
short_description: Heavy debug for medium and large bugs only; /coe, multi-path, and proof gate before repair.
default_prompt: Use $bug-killer for this bug only if the activation gate is met: I explicitly request bug-killer, heavy debug, evidence-gated debug, /coe, multi-path root-cause analysis, or repair only after proof; the impact crosses two or more modules/systems; at least two repair or user-feedback cycles failed; production/customer/data/security/release risk exists; the symptom is flaky or hard to reproduce; a deterministic bug hides in a deep state machine, data mutation path, cache lifecycle, concurrency path, or history-dependent flow; multiple root-cause families remain plausible; or diagnostic instrumentation is needed before trustable repair. If the gate is not met, say this heavy process is probably too costly and use a lightweight debug loop. When active, before writing the project-root /coe case file, determine repository visibility; for a public repository, ask whether to add root /coe/ to .gitignore so CoE stays local, never change .gitignore or Git tracking without confirmation, and if CoE is already tracked explain that ignore alone is insufficient and ask before untracking while preserving local files. Then create or update the /coe case file, represent candidate causes as falsifiable hypotheses, run independent research paths when useful, and do not design or implement a repair until a diagnostic log, probe, test, reproduction, runtime observation, telemetry, config fact, or user-feedback loop has produced evidence that confirms the root-cause mechanism against a predeclared prediction or diagnostic evidence-plan clause. If confidence is low, ask for the next diagnostic experiment instead of asking to fix. Keep diagnostic-only instrumentation separate from repair behavior, ask me to confirm before repair implementation, and only mark fixed after fix-validation evidence exists.
