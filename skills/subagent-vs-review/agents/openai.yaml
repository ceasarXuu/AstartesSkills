version: 1
display_name: Subagent VS Review
short_description: Runs fresh reviews that attack assumptions, implementation completeness, target benefits, usability, failure paths, and evidence gaps.
default_prompt: Use fresh internal subagents without inherited main-agent context to adversarially review this task by attacking the artifact's assumptions, happy paths, implementation completeness, target benefit realization, user-perspective usability, ease of use, ease of understanding, failure modes, and evidence gaps without targeting the author. If internal subagents are unavailable, discover local Claude, Codex, OpenCode, and Pi CLI commands and ask the user for explicit approval before using one as a degraded external CLI substitute; if none are available, ask whether the user has another local agent command, verify it, and use it only after explicit approval. Stop the review if no approved reviewer is available. Write the /vs_review/ report and respond to every finding before closure.
