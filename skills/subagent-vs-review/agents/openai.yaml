version: 1
display_name: Subagent VS Review
short_description: Runs fresh no-context-inheritance internal subagent reviews that attack artifact assumptions, failure paths, and evidence gaps.
default_prompt: Use fresh internal subagents without inherited main-agent context to adversarially review this task by attacking the artifact's assumptions, happy paths, failure modes, and evidence gaps without targeting the author; write the /vs_review/ report and respond to every finding before closure.
