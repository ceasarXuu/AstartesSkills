version: 1
display_name: Subagent VS Review
short_description: Runs bounded fresh reviews that attack assumptions, implementation completeness, target benefits, usability, failure paths, and evidence gaps without losing scope control.
default_prompt: Use fresh internal subagents without inherited main-agent context to adversarially review this task by attacking the artifact's assumptions, happy paths, implementation completeness, target benefit realization, user-perspective usability, ease of use, ease of understanding, failure modes, and evidence gaps without targeting the author. Freeze the original objective, acceptance criteria, non-goals, target locations, rollback checkpoint, and authoritative E0-E3 sources before review. Allow at most two automatic completed rounds: one initial review and one focused closure review. Require explicit user approval before any third or later round. Treat E4 reviewer reasoning as a hypothesis that cannot by itself authorize scope expansion, new dependencies, public API or persistent-data changes, cross-module abstractions, or work outside the frozen target. Stop on scope drift, repeated failure classes, non-decreasing blockers, net blocker growth, insufficient evidence, or round-budget exhaustion; write a convergence reflection and restore user control before further work. If internal subagents are unavailable, discover local Claude, Codex, OpenCode, and Pi CLI commands and ask the user for explicit approval before using one as a degraded external CLI substitute; if none are available, ask whether the user has another local agent command, verify it, and use it only after explicit approval. Stop the review if no approved reviewer is available. Write the /vs_review/ report, run the deterministic review governor, and respond to every finding before closure.
