version: 1
display_name: Dev Loop
short_description: Audit, prioritize, optimize, and protect software development feedback loops.
default_prompt: Use $dev-loop to audit, diagnose, optimize, or protect this project's development feedback loop. Optimize Time to Trusted Feedback rather than raw command speed. Choose Audit / Recovery when the current loop is slow or wasteful, and Guard / Prevention when normal engineering work must avoid expanding build scope, test scope, CI gates, cache invalidation, cold setup, architectural coupling, or coding-Agent duplication. Build Change, Evidence, Execution, and Critical Path models; measure representative cold and warm paths when possible; separate tactical waste from structural causes; classify every material finding with the hard P0-P5 ladder before comparing opportunity value; resolve trust or availability failures before ordinary speed work; follow the stabilize, remove waste, reduce scope, improve reuse, redesign gates, and restore locality sequence; compare only same-tier findings by critical-path saving, frequency, population, confidence, durability, effort, correctness risk, maintenance, and rollback difficulty; select exactly one Next Best Intervention with benefit, risk, evidence, rollback, validation, and a follow-up gate; default to one primary governance intervention plus one associated guardrail; stop when the feedback budget is met or marginal value is below governance cost; preserve incremental state by default; justify every blocking gate; require cache-correctness and validation-escalation evidence; and never claim a speedup that silently removes necessary engineering evidence.
