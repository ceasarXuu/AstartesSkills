version: 1
display_name: Dev Loop
short_description: Audit, optimize, and protect software development feedback loops.
default_prompt: Use $dev-loop to audit, diagnose, optimize, or protect this project's development feedback loop. Optimize Time to Trusted Feedback rather than raw command speed. Choose Audit / Recovery when the current loop is slow or wasteful, and Guard / Prevention when normal engineering work must avoid expanding build scope, test scope, CI gates, cache invalidation, cold setup, architectural coupling, or coding-Agent duplication. Build Change, Evidence, Execution, and Critical Path models; measure representative cold and warm paths when possible; separate tactical waste from structural causes; prefer eliminating, narrowing, reusing, and parallelizing work before accelerating or adding compute; preserve incremental state by default; justify every blocking gate; require cache-correctness and validation-escalation evidence; and never claim a speedup that silently removes necessary engineering evidence.
