interface:
  display_name: "Docs Manager"
  short_description: "Adaptive repository documentation governance"
  default_prompt: "Use $docs-manager to audit and organize this repository's documentation while preserving existing source-of-truth relationships and specialized artifact-owner contracts. Fix stale links, duplicate authority, archive drift, and navigation problems before considering structural migration; do not impose a fixed PRD or engineering-plan layout solely to match docs-manager defaults."
